# Настройки gitleaks (поиск секретов).
# Берём стандартные правила gitleaks и разрешаем только известные фиктивные значения из тестов.
# Папки тестов целиком НЕ исключаем: настоящий ключ, случайно вставленный в тест, должен находиться.
title = "TravelAgency gitleaks config"

[extend]
useDefault = true

# Фиктивный JWT-ключ интеграционных тестов. На сервере не используется,
# на dev и в проде ключ задаётся через .env. Разрешено только это точное значение.
# Новое тестовое значение добавляем отдельной строкой в regexes, а не папкой в paths.
# Сочетать regexes и paths через condition = "AND" не получится: gitleaks проверяет paths
# раньше правил и пропускает такой файл целиком, то есть это снова исключение папки.
[[allowlists]]
description = "Известные фиктивные ключи в тестовых проектах"
regexTarget = "secret"
regexes = [
  '''^TestSigningKeyWithAtLeast32CharactersForHMAC$''',
]

# Своё правило: пароль в строке подключения к базе (Npgsql, SQL Server, ADO.NET).
# Стандартные правила gitleaks такие строки не ловят: Host=...;Username=...;Password=... (см. #160).
# Ловим ключ Password= или Pwd= в начале строки, после ";", кавычки, обратной кавычки или пробела.
# Переменные окружения вида POSTGRES_PASSWORD=... сюда не попадают: перед ключом стоит "_".
# Знак "=" сразу после ключа, как в строках подключения; присваивания в коде (var password = ...) не ловим.
# Значение до ";", кавычки или пробела. Плейсхолдеры в угловых скобках (<пароль>) не совпадают вовсе.
[[rules]]
id = "connection-string-password"
description = "Пароль в строке подключения (Password= / Pwd=)"
regex = '''(?i)(?:^|[;"'`\s])(?:password|pwd)=([^;"'`\s<>]+)'''
secretGroup = 1
keywords = ["password",
  "pwd"]

# Что не считается паролем: подстановки и явные плейсхолдеры из примеров.
[[rules.allowlists]]
description = "Подстановки и плейсхолдеры в примерах строк подключения"
regexTarget = "secret"
regexes = [
  # ${POSTGRES_PASSWORD}, $POSTGRES_PASSWORD, %DB_PASSWORD%, {0}, {password}
  '''^\$''',
  '''^%[A-Za-z0-9_]+%$''',
  '''^\{[A-Za-z0-9_]*\}$''',
  # CHANGE_ME, changeme, change-me-..., REPLACE_..., your-password, ..., ***, xxx
  '''(?i)^change[_-]?me''',
  '''(?i)^replace[_-]''',
  '''(?i)^your[_-]''',
  '''^\.{3,}$''',
  '''^\*+$''',
  '''(?i)^x{3,}$''',
]

# Старые коммиты (март 2026) со строками подключения локальной разработки, до вынесения паролей в .env.
# Эти значения уже публичны, на сервере не используются, и убрать их можно только переписыванием истории.
# Разрешены только эти коммиты и только для этого правила: в новых коммитах такая строка будет найдена.
# Коммиты из двух копий истории: main и ветки, созданные до переписывания истории 2026-10-16.
