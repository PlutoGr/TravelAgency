# Настройки gitleaks (поиск секретов).
# Берём стандартные правила gitleaks и разрешаем только известные фиктивные значения из тестов.
# Папки тестов целиком НЕ исключаем: настоящий ключ, случайно вставленный в тест, должен находиться.
title = "TravelAgency gitleaks config"

[extend]
useDefault = true

# Фиктивный JWT-ключ интеграционных тестов. На сервере не используется,
# на dev и в проде ключ задаётся через .env. Разрешено только это точное значение.
# Новое тестовое значение добавляем отдельной строкой в regexes, а не папкой в paths.
# Сочетать regexes и paths через condition = "AND" не получится: gitleaks проверяет paths
# раньше правил и пропускает такой файл целиком, то есть это снова исключение папки.
[[allowlists]]
description = "Известные фиктивные ключи в тестовых проектах"
regexTarget = "secret"
regexes = [
  '''^TestSigningKeyWithAtLeast32CharactersForHMAC$''',
]
