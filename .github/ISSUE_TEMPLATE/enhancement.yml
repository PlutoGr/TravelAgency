name: Доработка
description: Новая функция или улучшение
title: "разработка(<сервис>): "
labels: ["enhancement", "статус: очередь"]
body:
  - type: markdown
    attributes:
      value: |
        Фича продукта: колонки Очередь → Аналитика → Архитектура → Тест-кейсы → Разработка → Приёмка → Готово. Страница `Feature-`. Родитель — эпик. Стадия равна метке `статус:*`, на вики её не дублировать.
        Заголовок: `<тип>(<сервис>): …` (`разработка`, реже `аналитика` / `инфраструктура`).
        Сервисы: `чат`, `каталог`, `бронирование`, `identity`, `медиа`, `шлюз`, `фронт`, `ci`, `деплой`, `бд`, `общее`, `процесс`.
        Текст безличный: без личных имён, без ролей и агентов как действующих лиц, без «я/мы». Если без этого неясно, можно назвать Cursor Automations.
        Правила: `.cursor/rules/project-github-formats.mdc`.
  - type: textarea
    id: zachem
    attributes:
      label: Зачем
      description: Какую проблему или потребность закрывает
    validations:
      required: true
  - type: textarea
    id: chto
    attributes:
      label: Что сделать
      description: Объём работ и границы
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Критерии приёмки
      description: Проверяемые условия
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: svyazi
    attributes:
      label: Связи
      description: Эпик, issues, PR, вики
    validations:
      required: false
