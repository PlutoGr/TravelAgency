name: Доработка
description: Новая функция или улучшение
title: "разработка(<сервис>): "
labels: ["enhancement", "статус: очередь"]
body:
  - type: markdown
    attributes:
      value: |
        Фича продукта. Размер (Малая или Крупная) записывается в аналитике. Вид и политика тестов записываются при разбиении (или в аналитике, если фичу открыли не из разбиения). Колонка «Тест-кейсы» только у Крупной с политикой «сначала сценарии»; остальные проходят её одним шагом с архитектурой. Страница `Feature-`. Родитель: эпик. Стадия равна метке `статус:*`, на вики её не дублировать.
        Заголовок: `<тип>(<сервис>): …` (`разработка`, реже `аналитика` / `инфраструктура`).
        Сервисы: `чат`, `каталог`, `бронирование`, `identity`, `медиа`, `шлюз`, `фронт`, `ci`, `деплой`, `бд`, `общее`, `процесс`.
        Текст безличный: без личных имён, без ролей и агентов как действующих лиц, без «я/мы». Если без этого неясно, можно назвать Cursor Automations.
        Только для фичи продукта. Процесс и правила: форма «Документация». Инфраструктура: пустой issue по шаблону `.cursor/templates/github/non-product-issue.md` (метки `enhancement` и `статус: очередь` добавляются при приведении к шаблону).
        Правила: `.cursor/elements/issues/feature.md`, шаблон `.cursor/templates/github/feature-issue.md`.
  - type: textarea
    id: zachem
    attributes:
      label: Зачем
      description: Какую проблему или потребность закрывает
    validations:
      required: true
  - type: textarea
    id: chto
    attributes:
      label: Что сделать
      description: Объём работ и границы. Строка «Размер» заполняется в аналитике.
      value: |
        Размер: <Малая | Крупная — на выходе Аналитики>
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Критерии приёмки
      description: Проверяемые условия
      value: |
        - [ ] 
        - [ ] Политика тестов соблюдена
        - [ ] Названные страницы `Doc-` актуальны (или «вики не затронута»)
    validations:
      required: true
  - type: textarea
    id: svyazi
    attributes:
      label: Связи
      description: Эпик, issues, PR, вики
    validations:
      required: true
