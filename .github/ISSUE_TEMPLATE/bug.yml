name: Ошибка
description: Существенное исправление (поле, экран или бизнес-правило) — тот же маршрут, что у фичи
title: "исправление(<сервис>): "
labels: ["bug", "статус: очередь"]
body:
  - type: markdown
    attributes:
      value: |
        Это баг-фича: те же колонки, что у фичи (Аналитика → Архитектура → Тест-кейсы → Разработка → Приёмка), метка `bug`, страница `Feature-`.
        Открывать только если правка существенная: добавить или убрать поле, изменить экран, изменить бизнес-правило.
        Опечатка или 500 из-за опечатки в открытой фиче: новую задачу не создавать, править эту фичу.
        Связанный с текущим эпиком баг — дочерняя задача этого эпика. Посторонний баг — в постоянный эпик багов, он не останавливает текущий эпик.
        В «Связях» указать фичу-источник и эпик.
        Заголовок: `<тип>(<сервис>): …` (для ошибки обычно `исправление`).
        Сервисы: `чат`, `каталог`, `бронирование`, `identity`, `медиа`, `шлюз`, `фронт`, `ci`, `деплой`, `бд`, `общее`, `процесс`.
        Текст безличный: без личных имён, без ролей и агентов как действующих лиц, без «я/мы». Если без этого неясно, можно назвать Cursor Automations.
        Полные правила: `.cursor/rules/project-github-formats.mdc`, `.cursor/rules/playbook-workflow.mdc`.
  - type: textarea
    id: zachem
    attributes:
      label: Зачем
      description: Какую проблему закрывает задача
      placeholder: На dev …
    validations:
      required: true
  - type: textarea
    id: chto
    attributes:
      label: Что сделать
      description: Конкретные шаги или ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Критерии приёмки
      description: Проверяемые условия (можно чеклистом)
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: svyazi
    attributes:
      label: Связи
      description: Эпик, фича-источник, связанные issues, PR, страница вики
      placeholder: "#NN (фича-источник), Epic-…, Feature-…"
    validations:
      required: false
