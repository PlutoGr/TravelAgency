name: Ошибка
description: "Существенное исправление (поле, экран или бизнес-правило): тот же маршрут, что у фичи"
title: "исправление(<сервис>): "
labels: ["bug", "статус: очередь"]
body:
  - type: markdown
    attributes:
      value: |
        Это баг-фича: тот же маршрут, что у фичи, метка `bug`, страница `Feature-`. Размер записывается в аналитике. Колонка «Тест-кейсы» только если размер Крупная и политика тестов «сначала сценарии».
        Открывать только если правка существенная: добавить или убрать поле, изменить экран, изменить бизнес-правило.
        Опечатка или 500 из-за опечатки в открытой фиче: новую задачу не создавать, править эту фичу.
        Связанный с текущим эпиком баг: дочерняя задача этого эпика. Посторонний баг: в постоянный бэклог #8, он не останавливает текущий эпик.
        В «Связях» указать фичу-источник и эпик.
        Заголовок: `<тип>(<сервис>): …` (для ошибки обычно `исправление`).
        Сервисы: `чат`, `каталог`, `бронирование`, `identity`, `медиа`, `шлюз`, `фронт`, `ci`, `деплой`, `бд`, `общее`, `процесс`.
        Текст безличный: без личных имён, без ролей и агентов как действующих лиц, без «я/мы». Если без этого неясно, можно назвать Cursor Automations.
        Полные правила: `.cursor/lifecycle/bugs.md`, `.cursor/elements/issues/bug-feature.md`, шаблон `.cursor/templates/github/bug-feature-issue.md`.
  - type: textarea
    id: zachem
    attributes:
      label: Зачем
      description: Какую проблему закрывает задача
      placeholder: На dev …
    validations:
      required: true
  - type: textarea
    id: chto
    attributes:
      label: Что сделать
      description: Конкретные шаги или ожидаемое поведение. Строка «Размер» заполняется в аналитике.
      value: |
        Размер: <Малая | Крупная — на выходе Аналитики>
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Критерии приёмки
      description: Проверяемые условия (можно чеклистом)
      value: |
        - [ ] 
        - [ ] Политика тестов соблюдена (новый устойчивый тест только если он указан в задаче)
        - [ ] Названные страницы `Doc-` актуальны (или «вики не затронута»)
    validations:
      required: true
  - type: textarea
    id: svyazi
    attributes:
      label: Связи
      description: Эпик, фича-источник, связанные issues, PR, страница вики
      placeholder: "#NN (фича-источник), Epic-…, Feature-…"
    validations:
      required: true
