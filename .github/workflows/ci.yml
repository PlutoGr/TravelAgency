# =====================================================================
# Проверка pull request: сборка и тесты .NET и фронтенда. Ничего не публикует и не деплоит.
# Деплой на dev только из main (deploy.yml).
# =====================================================================
name: CI

on:
  pull_request:
  workflow_dispatch:

# Новый пуш в тот же PR отменяет предыдущую проверку
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установка .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: dotnet restore
        run: dotnet restore TravelAgency.sln

      - name: dotnet build
        run: dotnet build TravelAgency.sln -c Release --no-restore

      - name: dotnet test
        run: dotnet test TravelAgency.sln -c Release --no-build --verbosity normal

  frontend:
    name: Фронтенд сборка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/travel-agency-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установка Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Frontend/travel-agency-frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # tsc + vite build
      - name: Сборка
        run: npm run build

      - name: Тесты (vitest)
        run: npx vitest run
