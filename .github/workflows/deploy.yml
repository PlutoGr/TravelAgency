# =====================================================================
# CI/CD для TravelAgency: тесты -> сборка образов -> GHCR -> деплой на dev
# Запускается при каждом push в ветку main.
# =====================================================================
name: Deploy to dev

on:
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

# Два деплоя одновременно не запускаем: новый пуш ждёт, пока закончится предыдущий.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

# Общие настройки: реестр и префикс имён образов (в GHCR имена только строчными буквами).
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/plutogr/travelagency
  DEV_HOST: 185.75.189.253

# Встроенный GITHUB_TOKEN: чтение кода и публикация образов в GHCR (секреты для GHCR не нужны)
permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------------
  # 1. Тесты: восстановление зависимостей, сборка и dotnet test.
  #    Если тесты падают, образы не собираются и деплоя не будет.
  # -------------------------------------------------------------------
  test:
    name: Тесты .NET
    runs-on: ubuntu-latest
    steps:
      # Забираем код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # Ставим .NET 10 SDK (точная версия берётся из global.json)
      - name: Установка .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Восстанавливаем NuGet-пакеты для всего решения
      - name: dotnet restore
        run: dotnet restore TravelAgency.sln

      # Сборка в Release (TreatWarningsAsErrors включён в Directory.Build.props)
      - name: dotnet build
        run: dotnet build TravelAgency.sln -c Release --no-restore

      # Запуск всех тестов решения
      - name: dotnet test
        run: dotnet test TravelAgency.sln -c Release --no-build --verbosity normal

  # -------------------------------------------------------------------
  # 2. Сборка Docker-образов через buildx и пуш в GHCR.
  #    Каждый образ собирается отдельной задачей матрицы, параллельно.
  #    Теги: latest и короткий sha коммита.
  # -------------------------------------------------------------------
  build:
    name: Образ ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway
            context: .
            dockerfile: src/Gateway/TravelAgency.Gateway/Dockerfile
          - name: identity
            context: .
            dockerfile: src/Services/Identity/TravelAgency.Identity.API/Dockerfile
          - name: catalog
            context: .
            dockerfile: src/Services/Catalog/TravelAgency.Catalog.API/Dockerfile
          - name: booking
            context: .
            dockerfile: src/Services/Booking/TravelAgency.Booking.API/Dockerfile
          - name: chat
            context: .
            dockerfile: src/Services/Chat/TravelAgency.Chat.API/Dockerfile
          - name: media
            context: .
            dockerfile: src/Services/Media/TravelAgency.Media.API/Dockerfile
          # Фронтенд тоже собираем, иначе сайт на сервере не обновится
          - name: frontend
            context: src/Frontend/travel-agency-frontend
            dockerfile: src/Frontend/travel-agency-frontend/Dockerfile
    steps:
      # Забираем код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # Включаем buildx (сборщик с кешем и поддержкой нескольких платформ)
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в GitHub Container Registry встроенным GITHUB_TOKEN (права packages: write выше)
      - name: Логин в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и пуш образа с тегами latest и sha коммита; кеш слоёв хранится в GitHub Actions
      - name: Сборка и пуш образа
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # -------------------------------------------------------------------
  # 3. Деплой на dev-сервер по SSH под пользователем deploy
  #    и проверка, что сайт отвечает.
  # -------------------------------------------------------------------
  deploy:
    name: Деплой на travelagency-dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # Кладём приватный ключ deploy и отпечаток сервера из секретов
      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # На сервере: логин в GHCR встроенным GITHUB_TOKEN (передаётся через stdin, в лог не попадает;
      # токен живёт только до конца задачи, этого хватает на pull), обновление кода,
      # скачивание новых образов и перезапуск контейнеров
      - name: Деплой по SSH
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | ssh deploy@${{ env.DEV_HOST }} \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin && \
             cd /opt/travelagency && \
             git pull --ff-only && \
             cd docker && \
             docker compose pull && \
             docker compose up -d && \
             docker image prune -f"

      # Проверка здоровья (dev закрыт basic auth, сертификат самоподписанный, поэтому curl -k):
      #  - HTTP редиректит на HTTPS (301);
      #  - HTTPS без пароля отвечает 401 (доступ закрыт);
      #  - /healthz через nginx и gateway отвечает Healthy (все сервисы живы, путь открыт без пароля);
      #  - API через gateway на сервере отвечает 200.
      # Ждём до 5 минут, иначе пайплайн красный.
      - name: Проверка здоровья
        run: |
          for i in $(seq 1 30); do
            http=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ env.DEV_HOST }}/" || true)
            auth=$(curl -sk -o /dev/null -w '%{http_code}' "https://${{ env.DEV_HOST }}/" || true)
            health=$(curl -sk "https://${{ env.DEV_HOST }}/healthz" || true)
            api=$(ssh deploy@${{ env.DEV_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/api/v1/catalog/tours" || true)
            echo "Попытка $i: http=$http (ждём 301), https без пароля=$auth (ждём 401), healthz=$health, API=$api"
            if [ "$http" = "301" ] && [ "$auth" = "401" ] && [ "$health" = "Healthy" ] && [ "$api" = "200" ]; then
              echo "HTTPS, пароль, API и все сервисы в порядке"; exit 0
            fi
            sleep 10
          done
          echo "Проверка здоровья не прошла за 5 минут"; exit 1
