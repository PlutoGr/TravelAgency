# Уведомление оркестратора после CI, Deploy или Secret scan (успех или ошибка). Секреты репозитория:
#   GROK_BOT_CICD_WEBHOOK_URL  : URL webhook routine «TravelAgency CI/CD»
#   GROK_BOT_CICD_WEBHOOK_KEY  : полное значение заголовка Authorization из панели routine
#     (схема может уже входить в значение). Значение секрета в репозиторий не записывается.
# Если секрета нет, job завершается с ошибкой: пропущенное уведомление должно быть видно.
# deployed_sha: для успешного «Deploy to dev» коммит, который реально развёрнут (артефакт deployed-sha запуска;
#   при откате это rollback_sha). Если запуск не успешен или артефакта нет, поле пустое.
# Значение conclusion=cancelled означает, что запуск вытеснен более новым; оркестратор его не обрабатывает.
# Ответ не 2xx завершает job с ошибкой.
name: Notify orchestrator

on:
  workflow_run:
    workflows:
      - CI
      - Deploy to dev
      - Secret scan
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  ping:
    name: Уведомление
    runs-on: ubuntu-latest
    steps:
      - name: Отправить webhook
        env:
          WEBHOOK_URL: ${{ secrets.GROK_BOT_CICD_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_BOT_CICD_WEBHOOK_KEY }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_KEY:-}" ]; then
            echo "::error::Секреты GROK_BOT_CICD_WEBHOOK_URL / GROK_BOT_CICD_WEBHOOK_KEY не заданы: уведомление не отправлено."
            exit 1
          fi
          # Хвостовой перевод строки в секрете не входит в значение заголовка.
          WEBHOOK_KEY=${WEBHOOK_KEY//$'\r'/}
          WEBHOOK_KEY=${WEBHOOK_KEY//$'\n'/}
          deployed_sha=""
          if [ "$WORKFLOW" = "Deploy to dev" ] && [ "$CONCLUSION" = "success" ]; then
            if gh run download "$RUN_ID" -n deployed-sha -D /tmp/deployed-sha >/dev/null 2>&1; then
              deployed_sha=$(tr -d '[:space:]' < /tmp/deployed-sha/deployed-sha.txt)
            fi
            if ! echo "$deployed_sha" | grep -Eq '^[0-9a-f]{40}$'; then deployed_sha=""; fi
          fi
          payload=$(jq -n \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg sha "$SHA" \
            --arg deployed_sha "$deployed_sha" \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            --arg event "$EVENT" \
            --arg run_id "$RUN_ID" \
            '{source:"github-actions",workflow:$workflow,conclusion:$conclusion,sha:$sha,deployed_sha:$deployed_sha,branch:$branch,html_url:$url,event:$event,run_id:$run_id}')
          # Секрет целиком является значением заголовка Authorization.
          code=$(curl -sS -o /tmp/cicd-ping.out -w "%{http_code}" -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: $WEBHOOK_KEY" \
            -d "$payload" || true)
          echo "HTTP $code"
          head -c 500 /tmp/cicd-ping.out || true
          case "$code" in
            2*) exit 0 ;;
            *) echo "Webhook не принял уведомление (HTTP $code)"; exit 1 ;;
          esac
