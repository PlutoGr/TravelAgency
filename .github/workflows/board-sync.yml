# =====================================================================
# Гигиена доски (GitHub Projects v2, проект 2). НЕ конечный автомат.
# Скрипт .github/scripts/board_order.py только: добавляет отсутствующие
# issues, архивирует закрытые 30+ дней, упорядочивает карточки внутри
# текущей колонки Status. Метки «статус: …» и поле Status не меняет -
# их ставит только оркестратор (.cursor/elements/board/README.md).
# Запуск: раз в сутки и вручную. Токен BOARD_TOKEN (classic, project).
# =====================================================================
name: Board sync

on:
  schedule:
    - cron: "0 0 * * *" # 03:00 по Москве
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  board:
    name: Гигиена доски
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.BOARD_TOKEN }}
    steps:
      - name: Проверка секрета
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Секрет BOARD_TOKEN не задан: Settings, Secrets and variables, Actions, New repository secret, имя BOARD_TOKEN (classic token с правом project)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Гигиена доски
        run: python3 .github/scripts/board_order.py
