services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: travel_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - full

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles:
      - full

  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/TravelAgency.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
    depends_on:
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      booking-service:
        condition: service_started

  identity-service:
    build:
      context: ..
      dockerfile: src/Services/Identity/TravelAgency.Identity.API/Dockerfile
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=travel_identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      # REQUIRED for gRPC service-to-service auth. Set GRPC_INTERNAL_SERVICE_TOKEN in your .env file.
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build:
      context: ..
      dockerfile: src/Services/Catalog/TravelAgency.Catalog.API/Dockerfile
    ports:
      - "5020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__CatalogDb=Host=postgres;Port=5432;Database=travel_catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: src/Services/Booking/TravelAgency.Booking.API/Dockerfile
    ports:
      - "5030:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__BookingDb=Host=postgres;Port=5432;Database=travel_booking;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      - GrpcClients__CatalogServiceUrl=http://catalog-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  chat-service:
    build:
      context: ..
      dockerfile: src/Services/Chat/TravelAgency.Chat.API/Dockerfile
    ports:
      - "5040:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=travel_chat;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Services__BookingServiceUrl=http://booking-service:8080
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      booking-service:
        condition: service_started
    profiles:
      - full

  media-service:
    build:
      context: ..
      dockerfile: src/Services/Media/TravelAgency.Media.API/Dockerfile
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Storage__ServiceUrl=http://minio:9000
      - Storage__AccessKey=${MINIO_ROOT_USER}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD}
      - Storage__BucketName=media
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
    depends_on:
      minio:
        condition: service_started
    profiles:
      - full

  frontend:
    build:
      context: ../src/Frontend/travel-agency-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    profiles:
      - full

volumes:
  postgres-data:
  minio-data:
