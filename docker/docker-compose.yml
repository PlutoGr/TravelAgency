services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: travel_identity
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./init-identity.sql:/docker-entrypoint-initdb.d/02-init-identity.sql:ro
      - ./init-chat.sql:/docker-entrypoint-initdb.d/03-init-chat.sql:ro
      - ./init-media.sql:/docker-entrypoint-initdb.d/04-init-media.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d travel_identity"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  gateway:
    build:
      context: ..
      dockerfile: src/Gateway/TravelAgency.Gateway/Dockerfile
    platform: linux/amd64
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      # Override appsettings.Development.json: use Docker service names instead of localhost
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-service:8080
      - ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address=http://booking-service:8080
      - ReverseProxy__Clusters__chat-cluster__Destinations__destination1__Address=http://chat-service:8080
      - ReverseProxy__Clusters__media-cluster__Destinations__destination1__Address=http://media-service:8080
      # Health check gateway (/health/ready) тоже должен ходить по именам сервисов, а не на localhost
      - HealthCheckEndpoints__Identity=http://identity-service:8080/health/live
      - HealthCheckEndpoints__Catalog=http://catalog-service:8080/health/live
      - HealthCheckEndpoints__Booking=http://booking-service:8080/health/live
      - HealthCheckEndpoints__Chat=http://chat-service:8080/health/live
      - HealthCheckEndpoints__Media=http://media-service:8080/health/live
      # Disable strict auth rate limiting in Docker dev (allows registration flow)
      - RateLimiting__Auth__Disabled=true
      - ConnectionStrings__Redis=redis:6379
      # Allow cookies on HTTP (localhost) for frontend dev with Vite proxy
      - Cookie__Secure=false
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      booking-service:
        condition: service_started
      chat-service:
        condition: service_started
      media-service:
        condition: service_started

  identity-service:
    build:
      context: ..
      dockerfile: src/Services/Identity/TravelAgency.Identity.API/Dockerfile
    platform: linux/amd64
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=travel_identity;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RateLimit__PermitLimit=10000
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      # REQUIRED for gRPC service-to-service auth. Set GRPC_INTERNAL_SERVICE_TOKEN in your .env file.
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build:
      context: ..
      dockerfile: src/Services/Catalog/TravelAgency.Catalog.API/Dockerfile
    platform: linux/amd64
    ports:
      - "5020:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__CatalogDb=Host=postgres;Port=5432;Database=travel_catalog;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      # REQUIRED for gRPC service-to-service auth. Set GRPC_INTERNAL_SERVICE_TOKEN in your .env file.
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
      # Catalog ходит в Media по gRPC (#37): проверка фото в PUT images и publish. Только внутренний порт 8081.
      - GrpcClients__MediaServiceUrl=http://media-service:8081
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ..
      dockerfile: src/Services/Booking/TravelAgency.Booking.API/Dockerfile
    platform: linux/amd64
    ports:
      - "5030:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__BookingDb=Host=postgres;Port=5432;Database=travel_booking;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      - GrpcClients__CatalogServiceUrl=http://catalog-service:8081
      - GrpcClients__IdentityServiceUrl=http://identity-service:8081
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  chat-service:
    build:
      context: ..
      dockerfile: src/Services/Chat/TravelAgency.Chat.API/Dockerfile
    platform: linux/amd64
    ports:
      - "5040:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__ChatDb=Host=postgres;Port=5432;Database=travel_chat;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - GrpcClients__BookingServiceUrl=http://booking-service:8081
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      booking-service:
        condition: service_started

  media-service:
    build:
      context: ..
      dockerfile: src/Services/Media/TravelAgency.Media.API/Dockerfile
    platform: linux/amd64
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_RUN_MIGRATIONS=true
      - ConnectionStrings__MediaDb=Host=postgres;Port=5432;Database=travel_media;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Storage__ServiceUrl=http://minio:9000
      - Storage__AccessKey=${MINIO_ROOT_USER}
      - Storage__SecretKey=${MINIO_ROOT_PASSWORD}
      - Storage__BucketName=media
      - JwtSettings__SigningKey=${JWT_SIGNING_KEY}
      - JwtSettings__Issuer=TravelAgency.Identity
      - JwtSettings__Audience=TravelAgency
      # REQUIRED for gRPC service-to-service auth (port 8081, internal only). Set GRPC_INTERNAL_SERVICE_TOKEN in your .env file.
      - GrpcSettings__InternalServiceToken=${GRPC_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ../src/Frontend/travel-agency-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    profiles:
      - full

volumes:
  postgres-data:
  minio-data:
