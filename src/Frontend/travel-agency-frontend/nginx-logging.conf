# Маскирование токенов в access-логе (http-уровень, кладётся в conf.d).
# SignalR передаёт JWT в query (?access_token=...), потому что браузерный WebSocket
# не умеет ставить заголовок Authorization. Стандартный формат "main" пишет "$request"
# целиком, и токен оседал бы в логе. Здесь значение параметра заменяется на ***,
# остальные параметры остаются видны для отладки.
map $request_uri $ta_masked_request_uri {
    "~^(?<ta_pre>.*[?&]access_token=)[^&]*(?<ta_post>.*)$" "${ta_pre}***${ta_post}";
    default $request_uri;
}

# Тот же токен может прийти в Referer, если страницу открыли по ссылке с ним.
map $http_referer $ta_masked_referer {
    "~^(?<ta_rpre>.*[?&]access_token=)[^&]*(?<ta_rpost>.*)$" "${ta_rpre}***${ta_rpost}";
    ""      "-";
    default $http_referer;
}

# Как "main" из образа nginx, но с замаскированными URI и Referer.
log_format ta_masked '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $ta_masked_request_uri $server_protocol" '
                     '$status $body_bytes_sent "$ta_masked_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
