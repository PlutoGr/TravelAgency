# Маскирование токенов в access-логе (http-уровень, кладётся в conf.d).
# SignalR передаёт JWT в query (?access_token=...), потому что браузерный WebSocket
# не умеет ставить заголовок Authorization. Стандартный формат "main" пишет "$request"
# целиком, и токен оседал бы в логе.
#
# Правило маски: начиная с ПЕРВОГО параметра access_token всё до конца строки
# заменяется на ***. Параметры до него остаются видны для отладки.
# Почему так, а не замена одного значения:
# - ~* без учёта регистра: Gateway (ASP.NET Core Request.Query) читает ключи без учёта
#   регистра и примет ?ACCESS_TOKEN=...;
# - access(_|%5F)token: ASP.NET Core декодирует имена ключей, поэтому примет и
#   ?access%5Ftoken=... (nginx видит сырую строку);
# - хвост целиком: при повторе ?access_token=A&access_token=B замена одного значения
#   оставила бы второе открытым, а nginx map не умеет заменять все вхождения.
# Ограничение: другие кодировки имени (например %61ccess_token) не ловятся. Настоящий
# клиент SignalR так не пишет.
map $request_uri $ta_masked_request_uri {
    "~*^(?<ta_pre>[^?]*\?(?:[^#]*?&)??access(?:_|%5f)token=)" "${ta_pre}***";
    default $request_uri;
}

# Тот же токен может прийти в Referer, если страницу открыли по ссылке с ним.
map $http_referer $ta_masked_referer {
    "~*^(?<ta_rpre>[^?]*\?(?:[^#]*?&)??access(?:_|%5f)token=)" "${ta_rpre}***";
    ""      "-";
    default $http_referer;
}

# Как "main" из образа nginx, но с замаскированными URI и Referer.
log_format ta_masked '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $ta_masked_request_uri $server_protocol" '
                     '$status $body_bytes_sent "$ta_masked_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
