# Режим по умолчанию: только HTTP на 80 (локальная разработка, docker compose без сертификатов).
# Если в контейнер смонтированы сертификаты, nginx-entrypoint.sh заменяет этот файл на nginx-https.conf.

# Для WebSocket (SignalR-хаб чата): при запросе с Upgrade передаём "upgrade", иначе обычное соединение
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/travelagency/app.conf;
}
