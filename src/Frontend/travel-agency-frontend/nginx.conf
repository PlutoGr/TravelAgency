# Для WebSocket (SignalR-хаб чата): при запросе с Upgrade передаём "upgrade", иначе обычное соединение
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности и запрет индексации dev-окружения.
    # Действуют во всех location, где нет своих add_header.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # HSTS включить только после перехода на HTTPS (задача #6), на HTTP браузеры его игнорируют:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Запрет индексации для поисковиков
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
        # WebSocket для SignalR (/api/v1/chat/hubs/chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_cookie_path / /;
    }
}
