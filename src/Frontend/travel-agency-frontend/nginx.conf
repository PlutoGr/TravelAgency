# Режим по умолчанию: только HTTP на 80 (локальная разработка, docker compose без сертификатов).
# Если в контейнер смонтированы сертификаты, nginx-entrypoint.sh заменяет этот файл на nginx-https.conf.

# Для WebSocket (SignalR-хаб чата): при запросе с Upgrade передаём "upgrade", иначе обычное соединение
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Basic auth dev-окружения не должен уходить в gateway: иначе gateway видит заголовок Authorization
# и не подставляет Bearer из cookie access_token. Заголовок Basic убираем, Bearer передаём как есть.
map $http_authorization $upstream_authorization {
    default    $http_authorization;
    "~*^Basic " "";
}

server {
    listen 80;
    server_name localhost;

    include /etc/nginx/travelagency/app.conf;
}
