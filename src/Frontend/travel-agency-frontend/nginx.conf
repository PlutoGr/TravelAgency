# Режим по умолчанию: только HTTP на 80 (локальная разработка, docker compose без сертификатов).
# Если в контейнер смонтированы сертификаты, nginx-entrypoint.sh заменяет этот файл конфигом из nginx-domain.conf.template (домен из SITE_DOMAIN).

# Для WebSocket (SignalR-хаб чата): при запросе с Upgrade передаём "upgrade", иначе обычное соединение
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Basic auth dev-окружения не должен уходить в gateway: иначе gateway видит заголовок Authorization
# и не подставляет Bearer из cookie access_token. Заголовок Basic убираем, Bearer передаём как есть.
map $http_authorization $upstream_authorization {
    default    $http_authorization;
    "~*^Basic " "";
}

server {
    listen 80;
    server_name localhost;
    # Access-лог с замаскированным access_token (формат ta_masked в nginx-logging.conf).
    # Задан на уровне server, поэтому заменяет access_log "main" из /etc/nginx/nginx.conf.
    # В подключаемых файлах (app.conf и default/*.conf) access_log не пишем, иначе строки задвоятся.
    access_log /var/log/nginx/access.log ta_masked;

    include /etc/nginx/travelagency/app.conf;
}
