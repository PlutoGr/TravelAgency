# Общая часть сервера для HTTP- и HTTPS-режима (подключается через include внутри server).

root /usr/share/nginx/html;
index index.html;

# Не показываем версию nginx в заголовках и страницах ошибок
server_tokens off;

# Basic auth: файл генерирует nginx-entrypoint.sh. Если смонтирован /etc/nginx/auth/htpasswd,
# нужен логин и пароль или cookie ta_dev_gate, которую nginx ставит после успешного входа
# (см. nginx-entrypoint.sh). Без htpasswd файл пустой и доступ открыт.
include /etc/nginx/travelagency/auth.conf;

include /etc/nginx/travelagency/headers.conf;

# Запрет индексации для поисковиков (доступен без пароля)
location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Проверка готовности для CI/CD и мониторинга: отдаёт только статус gateway
# (Healthy / Degraded / Unhealthy), доступна без пароля.
location = /healthz {
    auth_basic off;
    access_log off;
    proxy_pass http://gateway:8080/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location / {
    # После успешного basic auth выдаём cookie ta_dev_gate (только на ответы 2xx/3xx, без always).
    # В location /robots.txt и /healthz пароль не проверяется, поэтому cookie там не выдаётся.
    add_header Set-Cookie $ta_gate_cookie;
    include /etc/nginx/travelagency/headers.conf;
    try_files $uri $uri/ /index.html;
}

location /api/ {
    # Загрузка медиа: сервис принимает файлы до 10 МБ (Upload:MaxFileSizeBytes), даём запас
    client_max_body_size 12m;
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $upstream_authorization;
    # WebSocket для SignalR (/api/v1/chat/hubs/chat)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_cookie_path / /;
}
