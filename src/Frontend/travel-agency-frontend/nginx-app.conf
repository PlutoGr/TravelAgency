# Общая часть сервера для HTTP- и HTTPS-режима (подключается через include внутри server).

root /usr/share/nginx/html;
index index.html;

# Basic auth: файл генерирует nginx-entrypoint.sh. Если смонтирован /etc/nginx/auth/htpasswd,
# доступ только по логину и паролю, иначе файл пустой и доступ открыт.
include /etc/nginx/travelagency/auth.conf;

# Заголовки безопасности и запрет индексации dev-окружения.
# Действуют во всех location, где нет своих add_header.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Запрет индексации для поисковиков (доступен без пароля)
location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Проверка готовности для CI/CD и мониторинга: отдаёт только статус gateway
# (Healthy / Degraded / Unhealthy), доступна без пароля.
location = /healthz {
    auth_basic off;
    access_log off;
    proxy_pass http://gateway:8080/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
    # WebSocket для SignalR (/api/v1/chat/hubs/chat)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_cookie_path / /;
}
