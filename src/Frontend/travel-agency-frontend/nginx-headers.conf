# Заголовки безопасности и запрет индексации dev-окружения.
# Подключаются на уровне server и повторно в location, где есть свои add_header
# (nginx не наследует add_header в location, у которого есть собственные).
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
