# Режим HTTPS: включается автоматически, если смонтированы
# /etc/nginx/certs/tls.crt и /etc/nginx/certs/tls.key (см. nginx-entrypoint.sh).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Basic auth dev-окружения не должен уходить в gateway: иначе gateway видит заголовок Authorization
# и не подставляет Bearer из cookie access_token. Заголовок Basic убираем, Bearer передаём как есть.
map $http_authorization $upstream_authorization {
    default    $http_authorization;
    "~*^Basic " "";
}

# HTTP: всё перенаправляем на HTTPS
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS включить, когда будет домен и валидный сертификат (Let's Encrypt).
    # С самоподписанным сертификатом HSTS не включаем, иначе браузер не даст принять исключение.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/travelagency/app.conf;
}
