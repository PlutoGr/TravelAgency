syntax = "proto3";

option csharp_namespace = "TravelAgency.Contracts.Grpc.Identity";

package identity;

service IdentityGrpc {
  rpc GetUserSummary (GetUserSummaryRequest) returns (UserSummaryResponse);
}

message GetUserSummaryRequest {
  string user_id = 1;
}

message UserSummaryResponse {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  string avatar_url = 6;
  string display_name = 7;
}
