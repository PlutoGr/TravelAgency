syntax = "proto3";

option csharp_namespace = "TravelAgency.Contracts.Grpc.Catalog";

package catalog;

service CatalogService {
  rpc GetTourSnapshot (GetTourSnapshotRequest) returns (TourSnapshotResponse);

  // Снимок для уже существующей заявки. Возвращает опубликованный и снятый тур.
  // Черновик и неизвестный id: found=false. Формат полей тот же, что у GetTourSnapshot.
  rpc GetTourSnapshotForExistingBooking (GetTourSnapshotRequest) returns (TourSnapshotResponse);
}

message GetTourSnapshotRequest {
  string tour_id = 1;
}

message TourSnapshotResponse {
  string tour_id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string currency = 5;
  int32 duration_days = 6;
  string snapshot_taken_at = 7;
  bool found = 8;
}
